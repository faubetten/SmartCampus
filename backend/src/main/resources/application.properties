# Database connection used by the backend containers.
spring.datasource.url=jdbc:postgresql://smartcampus-db:5432/smartcampus_db
spring.datasource.username=campus_admin
spring.datasource.password=campus_secure_password_2026

# HikariCP limits connection wait time and pool size during failures or load spikes.
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.validation-timeout=5000