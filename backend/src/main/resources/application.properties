# Database connection used by the backend containers.
# The service name resolves to PostgreSQL inside the Docker network.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://smartcampus-db:5432/${DB_NAME:-smartcampus_db}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:-campus_admin}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# HikariCP limits connection wait time and pool size during failures or load spikes.
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.validation-timeout=5000

# JWT configuration for authentication and authorization.
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}