$kind: http-request
name: Book Room
method: POST
url: "{{baseUrl}}/api/scheduling/book?capacity=5&roomType=STUDY_POD&startTime=2025-01-15T09:00:00&endTime=2025-01-15T11:00:00"
order: 2000
description: Allocate the best available room and immediately persist a CONFIRMED reservation for the authenticated user. Requires a valid JWT.
auth:
  type: bearer
  credentials:
    token: "{{authToken}}"
queryParams:
  - key: capacity
    value: "5"
    disabled: false
    description: ""
  - key: roomType
    value: STUDY_POD
    disabled: false
    description: ""
  - key: startTime
    value: 2025-01-15T09:00:00
    disabled: false
    description: ""
  - key: endTime
    value: 2025-01-15T11:00:00
    disabled: false
    description: ""
