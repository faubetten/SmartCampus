# Basic Nginx configuration file for load balancing two Spring Boot backend instances.

events { worker_connections 1024; } # Maximum simultaneous connections per worker.

http {
    upstream backend_cluster {
        # The upstream group is the pool used for round-robin load balancing.
        server api-node-1:8080 max_fails=1 fail_timeout=5s;
        server api-node-2:8080 max_fails=1 fail_timeout=5s;
    }

    server {
        listen 80;

        # Forward every public request to the backend cluster.
        location / {
            proxy_pass http://backend_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }
    }
}