$kind: http-request
name: Update Campus Node
method: PUT
url: '{{baseUrl}}/api/admin/campus-nodes/{{nodeId}}'
order: 4000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{authToken}}'
body:
  type: json
  content: |-
    {
      "floorNumber": 2,
      "isAccessible": false
    }
