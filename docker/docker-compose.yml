services:
  # PostgreSQL is initialized from the SQL scripts on the first volume creation.
  smartcampus-db:
    image: postgres:16-alpine
    container_name: smartcampus-postgres
    restart: always
    environment:
      POSTGRES_DB: smartcampus_db
      POSTGRES_USER: campus_admin
      POSTGRES_PASSWORD: campus_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../sql/create.sql:/docker-entrypoint-initdb.d/01-create.sql
      - ../sql/populate.sql:/docker-entrypoint-initdb.d/02-populate.sql
    networks:
      - backend-network

  api-node-1:
    # Two identical API containers demonstrate redundancy behind Nginx.
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: smartcampus-api-1
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://smartcampus-db:5432/smartcampus_db
      SPRING_DATASOURCE_USERNAME: campus_admin
      SPRING_DATASOURCE_PASSWORD: campus_secure_password_2026
      INSTANCE_ID: "Node-1 (Primary)"
    depends_on:
      - smartcampus-db
    networks:
      - backend-network

  api-node-2:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: smartcampus-api-2
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://smartcampus-db:5432/smartcampus_db
      SPRING_DATASOURCE_USERNAME: campus_admin
      SPRING_DATASOURCE_PASSWORD: campus_secure_password_2026
      INSTANCE_ID: "Node-2 (Replica)"
    depends_on:
      - smartcampus-db
    networks:
      - backend-network

  load-balancer:
    # Nginx exposes one public endpoint and distributes requests to both API nodes.
    image: nginx:alpine
    container_name: smartcampus-nginx
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-node-1
      - api-node-2
    networks:
      - backend-network

volumes:
  pgdata:

networks:
  backend-network:
    driver: bridge